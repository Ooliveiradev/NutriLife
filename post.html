<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post — NutriLife</title>
  <link rel="stylesheet" href="css/links/link.css">
  <style>
    .post { padding: 48px 16px; }
    .post .container{ max-width: 900px; margin: 0 auto; }
    .post h1{ font-size: 2rem; margin: 12px 0; }
    .meta{ color:#6b7280; margin-bottom:18px; }
    .cover img{ width:100%; border-radius:12px; display:block; }
    .content{ line-height:1.8; font-size:1.1rem; color:#2b2b2b; }
    .content img{ max-width:100%; height:auto; }
  </style>
</head>
<body>
  <!-- seu header/nav aqui -->

  <section class="post">
    <div class="container">
      <div class="cover"></div>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
      <article class="content" id="content"></article>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    const url = new URL(location.href)
    const slug = url.searchParams.get('slug')
  
    const supabase = createClient('https://SEU-PROJ.supabase.co', 'SUA_ANON_KEY')
  
    const { data: post } = await supabase
      .from('posts')
      .select('*')
      .eq('slug', slug)
      .single()
  
    if (post) {
      document.querySelector('h1').textContent = post.title
      if (post.cover_url) {
        document.querySelector('.cover').innerHTML =
          `<img src="${post.cover_url}" alt="Capa do post ${post.title}">`
      }
      document.querySelector('.content').innerHTML = post.content  // pode ser HTML sanitizado ou Markdown renderizado
    }
  </script>
  
</body>
</html>
