<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post — NutriLife</title>
  <link rel="stylesheet" href="css/links/link.css">
  <style>
    .post { padding: 48px 16px; }
    .post .container{ max-width: 900px; margin: 0 auto; }
    .post h1{ font-size: 2rem; margin: 12px 0; }
    .meta{ color:#6b7280; margin-bottom:18px; }
    .cover img{ width:100%; border-radius:12px; display:block; }
    .content{ line-height:1.8; font-size:1.1rem; color:#2b2b2b; }
    .content img{ max-width:100%; height:auto; }
  </style>
</head>
<body>
  <!-- seu header/nav aqui -->

  <section class="post">
    <div class="container">
      <div class="cover"></div>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
      <article class="content" id="content"></article>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function getSlug(){ return new URL(location.href).searchParams.get('slug') }
    async function loadPost(){
      const slug = getSlug()
      const res  = await fetch('/data/posts.json', { cache: 'no-store' })
      const db   = await res.json()
      const post = db.items.find(p => p.slug === slug)
      if(!post){ document.getElementById('title').textContent = 'Post não encontrado.'; return }
      document.title = post.title + ' — NutriLife'
      document.getElementById('title').textContent = post.title
      document.getElementById('meta').textContent  =
        `${post.category ?? ''} • ${new Date(post.date).toLocaleDateString('pt-BR')}`
      if(post.cover){
        document.querySelector('.cover').innerHTML =
          `<img src="${post.cover}" alt="Capa do post ${post.title}">`
      }
      // Renderiza Markdown em HTML
      document.getElementById('content').innerHTML = marked.parse(post.content || '')
    }
    loadPost()
  </script>
</body>
</html>
