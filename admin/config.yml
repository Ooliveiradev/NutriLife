backend:
  name: git-gateway
  branch: main   # mude se seu branch for outro

media_folder: "images/uploads"     # onde os arquivos são salvos no repo
public_folder: "/images/uploads"   # caminho público usado no site

publish_mode: simple                # simples (sem workflow de rascunhos)

collections:
  - name: "posts"
    label: "Posts"
    files:
      - name: "posts-db"
        label: "Banco de Posts"
        file: "data/posts.json"
        format: "json"
        fields:
          - label: "Posts"
            name: "items"
            widget: "list"
            collapsed: true
            fields:
              - { label: "ID", name: "id", widget: "uuid" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Slug (url ex: como-montar-prato)", name: "slug", widget: "string" }
              - { label: "Categoria", name: "category", widget: "string", required: false }
              - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
              - { label: "Capa (opcional)", name: "cover", widget: "image", required: false }
              - { label: "Conteúdo (Markdown)", name: "content", widget: "markdown" }
