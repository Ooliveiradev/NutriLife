<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Receitas - NutriLife</title>
  <link rel="stylesheet" href="css/pages/receitas.css">
  <link rel="stylesheet" href="css/links/link.css">
  <link rel="shortcut icon" href="images/favicon/favicon.ico" type="image/x-icon">
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
</head>
<body>
  <header>
    <div class="logo">
      <img src="images/logo/ChatGPT-Image-17-de-ago.-de-2025_-11_02_59.svg" alt="Logo da marca NutriLife com maçã verde estilizada e garfo no centro, acompanhada do nome em tipografia moderna verde.">
    </div>

    <!-- Ações do topo (login/logout/criar post) -->
    <div class="header-actions">
      <span id="whoami" class="badge-green">Visitante</span>
      <button id="open-login" class="btn btn-secondary">Entrar</button>
      <button id="logout-btn" class="btn btn-secondary hidden">Sair</button>
      <button id="open-post-modal" class="btn btn-primary hidden">Criar post</button>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="imc.html">Calculadora de IMC</a></li>
      <li><a href="cal.html">Calculadora de Calorias</a></li>
      <li><a href="receitas.html">Banco de Receitas</a></li>
      <li><a href="diario.html">Diário Alimentar</a></li>
    </ul>
  </nav>
  
  <main>
    <section class="receitas-header">
      <div class="container">
        <h1>Banco de Receitas</h1>
        <div class="receitas-actions">
          <input type="text" id="search-receita" placeholder="Buscar receita, ingrediente ou tag..." autocomplete="off">
          <select id="filter-tag" title="Filtrar por tag" aria-label="Filtrar por tag">
            <option value="">Todas as tags</option>
          </select>
          <select id="filter-sort" title="Ordenar" aria-label="Ordenar">
            <option value="newest">Mais recentes</option>
            <option value="oldest">Mais antigas</option>
            <option value="title">Título (A–Z)</option>
          </select>
          <button id="add-receita-btn" class="btn btn-primary" onclick="openAddReceitaModal()"><i class="fa fa-plus"></i> Nova Receita</button>
        </div>
      </div>
    </section>
    <section id="receitas-list" class="receitas-grid container">
      <!-- Cards de receitas serão inseridos aqui via JS -->
    </section>
  </main>

  <!-- Modal de Nova Receita -->
  <div id="modal-add-receita" class="modal" aria-hidden="true">
    <header>
      <h3>Adicionar Receita</h3>
      <button class="close-btn" type="button" aria-label="Fechar modal" onclick="closeAddReceitaModal()">Fechar</button>
    </header>
    <form id="form-add-receita" autocomplete="off">
      <label for="receita-titulo">Título</label>
      <input type="text" id="receita-titulo" placeholder="Ex.: Panqueca de aveia" required>

      <label for="tag-input">Tags</label>
      <div class="chips-input">
        <div id="tags-chips" class="chips" aria-live="polite"></div>
        <input id="tag-input" type="text" list="tags-suggestions" placeholder="Digite e pressione Enter" aria-label="Adicionar tag">
        <datalist id="tags-suggestions">
          <option value="fit"></option>
          <option value="vegano"></option>
          <option value="vegetariano"></option>
          <option value="low carb"></option>
          <option value="doce"></option>
          <option value="salgado"></option>
          <option value="sem glúten"></option>
          <option value="sem lactose"></option>
          <option value="proteica"></option>
          <option value="rápida"></option>
        </datalist>
        <input id="receita-tags" type="hidden" />
      </div>

      <label for="receita-ingredientes">Ingredientes</label>
      <textarea id="receita-ingredientes" placeholder="Um ingrediente por linha" required></textarea>

      <label for="receita-modo">Modo de preparo</label>
      <textarea id="receita-modo" placeholder="Descreva o passo a passo" required></textarea>

      <label>Imagem</label>
      <div id="image-drop" class="dropzone" role="button" tabindex="0" aria-label="Adicionar imagem (arraste ou clique)">
        <input type="file" id="receita-imagem" accept="image/*" hidden>
        <img id="image-preview" alt="Prévia da imagem" style="max-width:100%;border-radius:10px;display:none;"/>
        <span class="hint">Arraste uma imagem aqui ou clique para selecionar</span>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="closeAddReceitaModal()">Cancelar</button>
        <button class="btn btn-primary" type="submit">Salvar Receita</button>
      </div>
    </form>
  </div>

  <!-- Modal de Detalhes da Receita -->
  <div id="modal-view-receita" class="modal" aria-hidden="true">
    <header>
      <h3 id="view-receita-titulo"></h3>
      <button class="close-btn" type="button" aria-label="Fechar modal" onclick="closeViewReceitaModal()">Fechar</button>
    </header>
    <img id="view-receita-imagem" src="" alt="Imagem da receita" style="max-width:100%;border-radius:12px;margin-bottom:16px;display:none;">
    <div class="tags" id="view-receita-tags"></div>
    <h4>Ingredientes</h4>
    <ul id="view-receita-ingredientes"></ul>
    <h4>Modo de preparo</h4>
    <p id="view-receita-modo"></p>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  
  <script type="module" src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/receitas.js"></script>
</body>
</html
